<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const isVite = function(val) {
          if (!val) return false;
          try {
            const str = typeof val === 'string' ? val : (val.message || val.stack || (typeof val === 'object' ? JSON.stringify(val) : String(val)));
            return str.includes('[vite]') || str.includes('websocket') || str.includes('WebSocket');
          } catch(e) {
            return false;
          }
        };
        ['log', 'warn', 'error', 'info', 'debug'].forEach(function(method) {
          const original = console[method];
          console[method] = function() {
            for (let i = 0; i < arguments.length; i++) {
              if (isVite(arguments[i])) return;
            }
            original.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          if (isVite(e.message) || isVite(e.filename) || (e.error && isVite(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isVite(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
