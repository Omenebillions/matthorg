    <script>
      (function() {
        // Handle Vite HMR websocket gracefully in sandboxed container environments where HMR is disabled
        if (typeof window !== 'undefined') {
          const NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              const isViteSocket =
                protocols === 'vite-hmr' ||
                protocols === 'vite-ping' ||
                (typeof protocols === 'string' && protocols.toLowerCase().includes('vite')) ||
                (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.toLowerCase().includes('vite'); })) ||
                (typeof url === 'string' && (url.includes('token=') || url.includes('24678') || url.includes('vite-hmr')));

              if (isViteSocket) {
                const listeners = {};
                const fakeSocket = {
                  url: url,
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                  addEventListener: function(type, callback) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(callback);
                    if (type === 'open') {
                      setTimeout(function() {
                        try { callback({ type: 'open', target: fakeSocket }); } catch(e) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(type, callback) {
                    if (!listeners[type]) return;
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== callback; });
                  },
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() {
                    fakeSocket.readyState = 3;
                    (listeners['close'] || []).forEach(function(cb) {
                      try { cb({ type: 'close', code: 1000, reason: 'Normal Closure', wasClean: true, target: fakeSocket }); } catch(e) {}
                    });
                  }
                };
                return fakeSocket;
              }
              return new NativeWebSocket(url, protocols);
            };
            try {
              Object.assign(window.WebSocket, NativeWebSocket);
              window.WebSocket.prototype = NativeWebSocket.prototype;
            } catch(e) {}
          }
        }

        const isVite = function(val) {
          if (!val) return false;
          try {
            const str = typeof val === 'string' ? val : (val.message || val.stack || val.filename || (typeof val === 'object' ? JSON.stringify(val) : String(val)));
            const lower = str.toLowerCase();
            return lower.includes('vite') || lower.includes('websocket');
          } catch(e) {
            return false;
          }
        };

        ['log', 'warn', 'error', 'info', 'debug'].forEach(function(method) {
          const original = console[method];
          console[method] = function() {
            for (let i = 0; i < arguments.length; i++) {
              if (isVite(arguments[i])) return;
            }
            original.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          if (isVite(e.message) || isVite(e.filename) || (e.error && isVite(e.error))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isVite(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Clean up any stale service workers in development / preview environment to prevent module interception
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          var isDevHost = window.location.hostname.indexOf('run.app') !== -1 ||
                          window.location.hostname === 'localhost' ||
                          window.location.hostname.indexOf('webcontainer') !== -1 ||
                          window.location.port === '3000';
          if (isDevHost) {
            var hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) {
                  caches.delete(names[i]);
                }
              });
            }
            if (hadController && !sessionStorage.getItem('sw_controller_purged_v2')) {
              sessionStorage.setItem('sw_controller_purged_v2', '1');
              setTimeout(function() {
                window.location.reload();
              }, 100);
            }
          }
        }
      })();
    </script>
